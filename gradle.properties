# Pin the JDK used for all Gradle builds: Android Studio's JBR 21.
# The system `java` on this machine is 25 and must NOT be used.
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 9 stack, mirroring Readium kotlin-toolkit 3.3.0's gradle.properties:
# Kotlin is built into AGP (no org.jetbrains.kotlin.android plugin) and the
# new DSL is enabled.
android.builtInKotlin=true
android.newDsl=true

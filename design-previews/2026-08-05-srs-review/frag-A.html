<style>
.srs-A{
  width:390px;height:760px;overflow:hidden;
  background:#f3f0e9;
  display:flex;align-items:center;justify-content:center;
  font-family:-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  color:#141414;
  -webkit-font-smoothing:antialiased;
}
.srs-A .card{
  width:350px;
  background:#fbfaf7;
  border:1px solid rgba(0,0,0,.10);
  border-radius:4px;
  padding:18px 20px 0;
  box-sizing:border-box;
}
.srs-A .kicker{
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;
  color:#5c5c58;
  padding-bottom:10px;
  border-bottom:1px solid rgba(0,0,0,.10);
}
.srs-A .progress{
  padding-top:12px;
  font-size:12px;color:#5c5c58;
  font-variant-numeric:tabular-nums;
}
.srs-A .sentence{
  margin-top:30px;
  padding-bottom:32px;
  font-family:'Fraunces',Georgia,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',serif;
  font-size:19px;line-height:1.5;color:#141414;
}
.srs-A .blank{
  position:relative;
  display:inline-block;
  width:92px;height:.72em;
  border-bottom:1.5px solid #141414;
  vertical-align:baseline;
}
.srs-A .pos{
  position:absolute;left:50%;top:100%;
  transform:translate(-50%,8px);
  font-family:-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;
  color:#a39e98;
  white-space:nowrap;
}
.srs-A .reveal{
  margin-top:6px;
  height:48px;
  display:flex;align-items:center;justify-content:center;
  background:#141414;color:#fbfaf7;
  border-radius:4px;
  font-size:15px;font-weight:500;letter-spacing:.04em;
}
.srs-A .grade{
  margin:20px -20px 0;
  border-top:1px solid rgba(0,0,0,.10);
  display:flex;
  min-height:52px;
}
.srs-A .g{
  flex:1;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;color:#141414;
}
.srs-A .g + .g{
  border-left:1px solid rgba(0,0,0,.10);
}
.srs-A .g span{
  color:#5c5c58;
  font-variant-numeric:tabular-nums;
}
</style>
<div class="srs-A">
  <div class="card">
    <div class="kicker"><span>Daily Review</span><span>Aug 5, 2026 · 12 Due</span></div>
    <div class="progress">第 3 个 / 共 12 个</div>
    <div class="sentence">Communities are proving remarkably <span class="blank"><span class="pos">Adj.</span></span> in the face of repeated flooding.</div>
    <div class="reveal">揭示</div>
    <div class="grade">
      <div class="g">认识 <span>&nbsp;· 4 天后</span></div>
      <div class="g">模糊 <span>&nbsp;· 10 分钟</span></div>
      <div class="g">不认识 <span>&nbsp;· 明天</span></div>
    </div>
  </div>
</div>

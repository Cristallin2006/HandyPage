<style>
.srs-B{box-sizing:border-box;width:390px;height:760px;overflow:hidden;background:#fbfaf7;color:#141414;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}
.srs-B div,.srs-B span{box-sizing:border-box;margin:0;padding:0;}
.srs-B button{margin:0;padding:0;border:0;background:none;font:inherit;color:inherit;cursor:pointer;}
.srs-B .srs-B-toprule{flex:none;height:2px;background:#141414;}
.srs-B .srs-B-body{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 22px 26px;}
.srs-B .srs-B-kicker{flex:none;display:flex;justify-content:space-between;align-items:baseline;padding-top:16px;font-family:'Fraunces',Georgia,serif;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:#5c5c58;font-variant-numeric:tabular-nums;}
.srs-B .srs-B-prog{flex:none;margin-top:14px;}
.srs-B .srs-B-prog-meta{font-family:'Fraunces',Georgia,serif;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:#5c5c58;font-variant-numeric:tabular-nums;}
.srs-B .srs-B-prog-track{margin-top:8px;height:2px;background:rgba(0,0,0,.10);}
.srs-B .srs-B-prog-fill{height:2px;width:25%;background:#141414;}
.srs-B .srs-B-stage{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;}
.srs-B .srs-B-word{font-family:'Fraunces',Georgia,serif;font-weight:700;font-style:normal;font-size:84px;line-height:1;letter-spacing:-.02em;color:#141414;}
.srs-B .srs-B-entry{margin-top:18px;display:flex;align-items:baseline;flex-wrap:wrap;gap:10px;}
.srs-B .srs-B-phon{font-family:'Fraunces',Georgia,serif;font-size:16px;color:#141414;font-variant-numeric:tabular-nums;}
.srs-B .srs-B-pos{font-family:'Fraunces',Georgia,serif;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:#5c5c58;}
.srs-B .srs-B-def{font-size:14px;color:#5c5c58;}
.srs-B .srs-B-sent{margin-top:32px;font-family:'Fraunces',Georgia,serif;font-size:21px;line-height:1.5;color:#141414;}
.srs-B .srs-B-sent strong{font-weight:700;font-style:normal;}
.srs-B .srs-B-srchair{margin-top:28px;height:1px;background:rgba(0,0,0,.10);}
.srs-B .srs-B-src{margin-top:10px;font-family:'Fraunces',Georgia,serif;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:#5c5c58;font-variant-numeric:tabular-nums;}
.srs-B .srs-B-grade{flex:none;}
.srs-B .srs-B-btn-know{display:flex;align-items:center;justify-content:space-between;width:100%;height:54px;padding:0 18px;background:#141414;color:#fbfaf7;border-radius:4px;font-size:16px;}
.srs-B .srs-B-btn-know .srs-B-next{font-size:14px;color:rgba(251,250,247,.66);font-variant-numeric:tabular-nums;}
.srs-B .srs-B-btn-row{display:flex;gap:10px;margin-top:10px;}
.srs-B .srs-B-btn-sub{flex:1;height:50px;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid #141414;border-radius:4px;background:transparent;color:#141414;font-size:14px;}
.srs-B .srs-B-btn-sub .srs-B-t{color:#5c5c58;font-variant-numeric:tabular-nums;}
</style>
<div class="srs-B">
  <div class="srs-B-toprule"></div>
  <div class="srs-B-body">
    <div class="srs-B-kicker"><span>Daily Review</span><span>Aug 5, 2026 · 12 Due</span></div>
    <div class="srs-B-prog">
      <div class="srs-B-prog-meta">Word 3 / 12</div>
      <div class="srs-B-prog-track"><div class="srs-B-prog-fill"></div></div>
    </div>
    <div class="srs-B-stage">
      <div class="srs-B-word">resilient</div>
      <div class="srs-B-entry"><span class="srs-B-phon">/rɪˈzɪlɪənt/</span><span class="srs-B-pos">adj.</span><span class="srs-B-def">坚韧的,能迅速恢复的</span></div>
      <div class="srs-B-sent">Communities are proving remarkably <strong>resilient</strong> in the face of repeated flooding.</div>
      <div class="srs-B-srchair"></div>
      <div class="srs-B-src">NPR · Saved 3 Days Ago</div>
    </div>
    <div class="srs-B-grade">
      <button type="button" class="srs-B-btn-know"><span>认识</span><span class="srs-B-next">下次 4 天后</span></button>
      <div class="srs-B-btn-row">
        <button type="button" class="srs-B-btn-sub"><span>模糊</span><span class="srs-B-t">10 分钟后</span></button>
        <button type="button" class="srs-B-btn-sub"><span>不认识</span><span class="srs-B-t">明天再会</span></button>
      </div>
    </div>
  </div>
</div>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handypage 主界面主题试衣间</title>
<style>
  @font-face { font-family: 'Fraunces'; src: url('fraunces_semibold.ttf') format('truetype'); font-weight: 600; }
  @font-face { font-family: 'Fraunces'; src: url('fraunces_bold.ttf') format('truetype'); font-weight: 700; }
  @font-face { font-family: 'Pinyon'; src: url('pinyon_script.ttf') format('truetype'); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --ease-out: cubic-bezier(0.23, 1, 0.32, 1); }

  body {
    min-height: 100dvh;
    background: #e9e7e1;
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    color: #141414;
    padding: 32px 20px 48px;
  }

  .bench-head { text-align: center; display: grid; gap: 8px; margin-bottom: 24px; justify-items: center; }
  .bench-head .kicker { font-size: 11px; font-weight: 500; letter-spacing: .12em; color: #6b6760; text-transform: uppercase; }
  .bench-head h1 { font-family: 'Fraunces', Georgia, serif; font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
  .bench-head .note { font-size: 12px; color: #8a857c; max-width: 560px; line-height: 1.7; }

  .mode-seg { display: inline-flex; border: 1px solid #cfccc4; border-radius: 6px; overflow: hidden; margin-top: 4px; }
  .mode-seg button {
    border: none; background: transparent; cursor: pointer;
    font-size: 12px; font-weight: 500; color: #6b6760;
    padding: 7px 18px; font-family: inherit;
    transition: background-color 150ms var(--ease-out), color 150ms var(--ease-out);
  }
  .mode-seg button + button { border-left: 1px solid #cfccc4; }
  .mode-seg button.on { background: #141414; color: #fbfaf7; }

  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; max-width: 1240px; margin: 0 auto; }
  @media (max-width: 1080px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 640px) { body { padding: 20px 12px 36px; } .grid { grid-template-columns: minmax(0, 1fr); } }

  .card { display: grid; gap: 12px; align-content: start; min-width: 0; }

  /* ---------- 主界面样机框 ---------- */
  .frame {
    position: relative; height: 440px; border-radius: 14px; overflow: hidden;
    background: var(--paper); border: 1px solid var(--hair);
    box-shadow: 0 1px 2px rgb(0 0 0 / .05), 0 8px 20px rgb(0 0 0 / .06);
    display: flex; flex-direction: column;
    transition: transform 180ms var(--ease-out), box-shadow 180ms var(--ease-out),
                background-color 200ms var(--ease-out);
  }
  .card:hover .frame { transform: translateY(-2px); box-shadow: 0 2px 4px rgb(0 0 0 / .05), 0 14px 30px rgb(0 0 0 / .09); }

  /* ---------- 主题变量:light 默认,dark 由 body[data-mode] 覆盖 ---------- */
  .t-classic   { --paper:#FBFAF7; --ink:#141414; --sub:#5C5C58; --faint:#A39E98; --hair:rgba(0,0,0,.10);      --accent:#141414; --onAccent:#FBFAF7; --accentSoft:#F3F0E9; --onAccentSoft:#5C5C58; }
  .t-forest    { --paper:#F5F7F3; --ink:#182420; --sub:#54665A; --faint:#9AA89C; --hair:rgba(24,36,32,.11);   --accent:#2E6B4F; --onAccent:#FBFDFB; --accentSoft:#DCE7DD; --onAccentSoft:#1E4634; }
  .t-burgundy  { --paper:#F9F4F2; --ink:#251A1C; --sub:#6E5457; --faint:#B4A09E; --hair:rgba(37,26,28,.11);   --accent:#7E2F3A; --onAccent:#FDF7F6; --accentSoft:#F0DCDB; --onAccentSoft:#5A1F28; }
  .t-prussian  { --paper:#F3F6F9; --ink:#161E26; --sub:#4E6070; --faint:#97A5B1; --hair:rgba(22,30,38,.11);   --accent:#2C547E; --onAccent:#F7FAFD; --accentSoft:#DCE5EE; --onAccentSoft:#1E3D5E; }
  .t-iris      { --paper:#F7F4FA; --ink:#1D1A26; --sub:#605A72; --faint:#A5A0B2; --hair:rgba(29,26,38,.11);   --accent:#6A5296; --onAccent:#FBF9FD; --accentSoft:#E7DFF0; --onAccentSoft:#4A3870; }
  .t-oat       { --paper:#F8F5EF; --ink:#211D15; --sub:#665D48; --faint:#ADA48D; --hair:rgba(33,29,21,.11);   --accent:#8A6D3B; --onAccent:#FDFAF3; --accentSoft:#EDE3CF; --onAccentSoft:#664E24; }

  body[data-mode="dark"] .t-classic  { --paper:#171512; --ink:#ECE7DB; --sub:#A8A29A; --faint:#6F6A62; --hair:rgba(255,255,255,.14); --accent:#ECE7DB; --onAccent:#171512; --accentSoft:#26231E; --onAccentSoft:#A8A29A; }
  body[data-mode="dark"] .t-forest   { --paper:#141B17; --ink:#DCE5DC; --sub:#93A396; --faint:#57685B; --hair:rgba(220,229,220,.15); --accent:#8FC0A4; --onAccent:#0F1713; --accentSoft:#24352B; --onAccentSoft:#A8CDB8; }
  body[data-mode="dark"] .t-burgundy { --paper:#1C1415; --ink:#E5DCDC; --sub:#A49393; --faint:#6B5557; --hair:rgba(229,220,220,.15); --accent:#D08D94; --onAccent:#1C1113; --accentSoft:#3A2226; --onAccentSoft:#E0AAAF; }
  body[data-mode="dark"] .t-prussian { --paper:#121A22; --ink:#DCE4EC; --sub:#8FA0B0; --faint:#4E6070; --hair:rgba(220,228,236,.15); --accent:#8FB3D4; --onAccent:#0E151C; --accentSoft:#1F3040; --onAccentSoft:#A9C6E0; }
  body[data-mode="dark"] .t-iris     { --paper:#17141F; --ink:#E2DDEA; --sub:#9C95AC; --faint:#5C5670; --hair:rgba(226,221,234,.15); --accent:#B9A3D6; --onAccent:#16121E; --accentSoft:#2A2338; --onAccentSoft:#C9B8E2; }
  body[data-mode="dark"] .t-oat      { --paper:#1A1712; --ink:#E6DFD2; --sub:#A79E88; --faint:#665D48; --hair:rgba(230,223,210,.15); --accent:#C9A86C; --onAccent:#191510; --accentSoft:#352C1D; --onAccentSoft:#D9BE8A; }

  /* ---------- 页面区(阅读 tab 微缩) ---------- */
  .page { flex: 1; min-height: 0; overflow: hidden; padding: 16px 16px 10px; display: flex; flex-direction: column; }
  .m-kicker { font-size: 10px; font-weight: 500; letter-spacing: .12em; color: var(--sub); text-transform: uppercase; }
  .m-title-row { display: flex; align-items: baseline; gap: 8px; margin-top: 4px; }
  .m-title { font-size: 24px; font-weight: 700; color: var(--ink); letter-spacing: .02em; }
  .m-title-en { font-family: 'Fraunces', Georgia, serif; font-size: 13px; font-weight: 600; color: var(--sub); }
  .m-meta { margin-top: 4px; font-size: 11px; color: var(--sub); font-variant-numeric: tabular-nums; }
  .m-rule { border-top: 1px solid var(--hair); margin: 12px 0 2px; }

  .m-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--hair); }
  .m-mono {
    font-family: 'Fraunces', Georgia, serif; font-size: 18px; font-weight: 600;
    color: var(--ink); width: 26px; text-align: center; flex-shrink: 0;
  }
  .m-row-main { flex: 1; min-width: 0; }
  .m-row-title {
    font-family: Georgia, serif; font-size: 13px; line-height: 1.4; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .m-row-meta { font-size: 10px; color: var(--faint); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .m-badge {
    flex-shrink: 0; font-size: 9.5px; font-weight: 600; letter-spacing: .04em;
    background: var(--accentSoft); color: var(--onAccentSoft);
    border-radius: 3px; padding: 3px 7px;
  }
  .m-badge.proxy { background: transparent; color: #B3352B; border: 1px solid #B3352B; font-weight: 600; }
  body[data-mode="dark"] .m-badge.proxy { color: #D4574A; border-color: #D4574A; }

  .m-cta {
    margin-top: 12px; height: 34px; border: none; border-radius: 4px;
    background: var(--accent); color: var(--onAccent);
    font-size: 12.5px; font-weight: 600; font-family: inherit;
    display: grid; place-items: center;
  }

  /* ---------- 底栏(2dp 墨线 + Pinyon 花体) ---------- */
  .m-nav { flex-shrink: 0; border-top: 2px solid var(--ink); padding: 6px 0 8px; display: flex; }
  .m-item { flex: 1; display: grid; justify-items: center; gap: 1px; color: var(--sub); }
  .m-item .glyph { font-family: 'Pinyon', cursive; font-size: 20px; line-height: 1.3; height: 26px; display: grid; place-items: center; }
  .m-item .lab { font-size: 10.5px; }
  .m-item .dash { width: 22px; height: 2px; margin-top: 2px; background: transparent; }
  .m-item.on { color: var(--accent); }
  .m-item.on .lab { font-weight: 600; }
  .m-item.on .dash { background: var(--accent); }

  /* ---------- 说明区 ---------- */
  .meta { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 2px; }
  .meta .names { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .meta strong { font-size: 15px; font-weight: 600; white-space: nowrap; }
  .meta .en { font-family: 'Fraunces', Georgia, serif; font-size: 13px; font-weight: 600; color: #6b6760; }
  .meta .dots { display: inline-flex; gap: 4px; }
  .meta .dots i { width: 12px; height: 12px; border-radius: 999px; display: block; border: 1px solid rgb(0 0 0 / .12); }
  .meta .vibe { font-size: 11.5px; color: #8a857c; text-align: right; }
  .rec { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: .06em; color: #fbfaf7; background: #2e6b4f; border-radius: 3px; padding: 2px 6px; }

  .qmdp-pick-button { width: 100%; justify-content: center; }
</style>
</head>
<body data-mode="light">
  <div class="bench-head">
    <div class="kicker">Handypage · 主界面主题试衣间</div>
    <h1>主界面换色 · 六款</h1>
    <div class="note">设计方向样机,不是最终 App;选择后才进入正式实现。阅读器主题不动;功能红(代理/错误)不随主题变。</div>
    <div class="mode-seg" id="modeSeg">
      <button data-mode="light" class="on">亮色预览</button>
      <button data-mode="dark">暗色预览</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>

<script>
  const THEMES = [
    { cls: 'classic',  id: 'classic',  zh: '经典墨',   en: 'Classic Ink',  vibe: '现状对照 · 不着色的编辑墨', rec: false,
      dots: ['#141414', '#F3F0E9'] },
    { cls: 'forest',   id: 'forest',   zh: '森林绿',   en: 'Forest',       vibe: '松绿主色 + 苔绿浅底,阅读感最稳', rec: true,
      dots: ['#2E6B4F', '#DCE7DD'] },
    { cls: 'burgundy', id: 'burgundy', zh: '勃艮第红', en: 'Burgundy',     vibe: '酒红主色 + 胭脂浅底,暖而收', rec: false,
      dots: ['#7E2F3A', '#F0DCDB'] },
    { cls: 'prussian', id: 'prussian', zh: '普鲁士蓝', en: 'Prussian',     vibe: '普鲁士蓝 + 钢青浅底,冷静专注', rec: false,
      dots: ['#2C547E', '#DCE5EE'] },
    { cls: 'iris',     id: 'iris',     zh: '鸢尾花',   en: 'Iris',         vibe: '鸢尾紫 + 藕荷浅底,柔而不甜', rec: false,
      dots: ['#6A5296', '#E7DFF0'] },
    { cls: 'oat',      id: 'oat',      zh: '燕麦拿铁', en: 'Oat Latte',    vibe: '铜棕主色 + 燕麦浅底,暖意中性', rec: false,
      dots: ['#8A6D3B', '#EDE3CF'] },
  ];

  const frameHTML = t => `
    <div class="page">
      <div class="m-kicker">Handypage</div>
      <div class="m-title-row"><span class="m-title">阅读</span><span class="m-title-en">Reading</span></div>
      <div class="m-meta">5 个源 · 12 篇新文章</div>
      <div class="m-rule"></div>
      <div class="m-row">
        <span class="m-mono">N</span>
        <div class="m-row-main">
          <div class="m-row-title">How plants learn to forget the drought</div>
          <div class="m-row-meta">nature news · 2h</div>
        </div>
        <span class="m-badge">新刊</span>
      </div>
      <div class="m-row">
        <span class="m-mono">C</span>
        <div class="m-row-main">
          <div class="m-row-title">China's wetlands turn a deeper green</div>
          <div class="m-row-meta">china daily · 5h</div>
        </div>
      </div>
      <div class="m-row">
        <span class="m-mono">A</span>
        <div class="m-row-main">
          <div class="m-row-title">Saturn's rings, closer than ever</div>
          <div class="m-row-meta">apod · 1d</div>
        </div>
        <span class="m-badge proxy">需代理</span>
      </div>
      <div class="m-cta">抓取最新一期</div>
    </div>
    <div class="m-nav">
      <div class="m-item on"><span class="glyph">R</span><span class="lab">阅读</span><span class="dash"></span></div>
      <div class="m-item"><span class="glyph">L</span><span class="lab">我的</span><span class="dash"></span></div>
      <div class="m-item"><span class="glyph">A</span><span class="lab">Agent</span><span class="dash"></span></div>
      <div class="m-item"><span class="glyph">S</span><span class="lab">设置</span><span class="dash"></span></div>
    </div>`;

  document.getElementById('grid').innerHTML = THEMES.map(t => `
    <section class="card" data-design-option="${t.id}" data-name="${t.zh} ${t.en}">
      <div class="frame t-${t.cls}">${frameHTML(t)}</div>
      <div class="meta">
        <div class="names">
          <strong>${t.zh}</strong><span class="en">${t.en}</span>
          <span class="dots"><i style="background:${t.dots[0]}"></i><i style="background:${t.dots[1]}"></i></span>
          ${t.rec ? '<span class="rec">推荐</span>' : ''}
        </div>
        <div class="vibe">${t.vibe}</div>
      </div>
      <button class="qmdp-pick-button" type="button">选择 · ${t.zh}</button>
    </section>`).join('');

  document.querySelectorAll('#modeSeg button').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('#modeSeg button').forEach(x => x.classList.toggle('on', x === b));
      document.body.dataset.mode = b.dataset.mode;
    };
  });
</script>
</body>
</html>

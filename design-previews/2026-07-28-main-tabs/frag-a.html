<style>
.dirA-stage,.dirA-stage *{box-sizing:border-box}
.dirA-stage{width:390px;height:640px;overflow:hidden;position:relative;background:#fafafa;color:#171717;font-family:"Sora",-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased}
.dirA-stage .dirA-head{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #e5e5e5}
.dirA-stage .dirA-title{font-size:24px;line-height:32px;font-weight:700;letter-spacing:.02em}
.dirA-stage .dirA-gear{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:#737373}
.dirA-stage .dirA-hicon{width:20px;height:20px;display:block}
.dirA-stage .dirA-group-sep{margin-top:23px;border-top:1px solid #e5e5e5}
.dirA-stage .dirA-glabel{padding:0 20px;font-size:11px;line-height:14px;font-weight:600;letter-spacing:.12em;color:#737373;text-transform:uppercase}
.dirA-stage .dirA-glabel-first{padding-top:6px}
.dirA-stage .dirA-row{height:56px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid #e5e5e5}
.dirA-stage .dirA-row-last{border-bottom:none}
.dirA-stage .dirA-mono{width:40px;height:40px;flex:none;border-radius:50%;border:1.5px solid #4f46e5;color:#4f46e5;display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;font-weight:600}
.dirA-stage .dirA-rtext{display:flex;flex-direction:column;gap:2px;min-width:0}
.dirA-stage .dirA-rname{font-size:14px;line-height:18px;font-weight:400;color:#171717;white-space:nowrap}
.dirA-stage .dirA-rdom{font-size:12px;line-height:16px;font-weight:400;color:#737373;white-space:nowrap}
.dirA-stage .dirA-tag{margin-left:auto;flex:none;font-size:10px;line-height:16px;font-weight:600;letter-spacing:.02em;color:#b45309;border:1px solid rgba(180,83,9,.45);border-radius:4px;padding:0 6px}
.dirA-stage .dirA-nav{position:absolute;left:0;right:0;bottom:0;height:52px;background:#ffffff;border-top:1px solid #e5e5e5;display:flex}
.dirA-stage .dirA-nitem{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#737373}
.dirA-stage .dirA-nitem-on{color:#4f46e5}
.dirA-stage .dirA-nicon{width:20px;height:20px;display:block}
.dirA-stage .dirA-nlab{font-size:10px;line-height:12px;font-weight:400;letter-spacing:.02em}
.dirA-stage .dirA-nitem-on .dirA-nlab{font-weight:600}
</style>
